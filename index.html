<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App with Auth</title>
    <link rel="stylesheet" href="pr 1.css">
</head>
<body>
    <div class="app-container" id="app-container">
        
        <!-- Authentication Section -->
        <section id="auth-section" class="active">
            <div class="auth-box">
                <h2 id="auth-title">Login</h2>
                <form id="auth-form">
                    <input type="text" id="username" placeholder="Username" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit" id="auth-btn">Login</button>
                </form>
                <p id="auth-error" class="error-msg"></p>
                <p class="toggle-text">
                    <span id="toggle-msg">Don't have an account?</span> 
                    <button id="toggle-auth-mode">Sign Up</button>
                </p>
            </div>
        </section>

        <!-- Weather App Section -->
        <section id="weather-section" class="hidden">
            <header>
                <h2>Weather Dashboard</h2>
                <div class="user-controls">
                    <span id="welcome-msg"></span>
                    <button id="logout-btn">Logout</button>
                </div>
            </header>

            <main>
                <div class="search-box">
                    <input type="text" id="city-input" placeholder="Enter city name...">
                    <button id="search-btn">Search</button>
                </div>

                <div id="loader" class="loader hidden"></div>
                <p id="weather-error" class="error-msg"></p>

                <div id="weather-result" class="weather-card hidden">
                    <h3 id="city-name"></h3>
                    <img id="weather-icon" src="" alt="Weather Icon">
                    <div class="temp-box">
                        <span id="temperature"></span>°C
                    </div>
                    <p id="weather-condition"></p>
                    
                    <div class="weather-details">
                        <div class="detail">
                            <span>Humidity</span>
                            <strong id="humidity"></strong>%
                        </div>
                        <div class="detail">
                            <span>Wind Speed</span>
                            <strong id="wind-speed"></strong> m/s
                        </div>
                    </div>
                </div>
            </main>
        </section>

    </div>
    <script src="C:\Users\Admin\OneDrive\Desktop\web dev\prjava script.js"></script>
</body>
</html>
